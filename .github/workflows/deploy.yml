name: Deploy to Xserver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Xserver via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 10022 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # 置き先が無いまま rsync すると、終了コード1だけが返って理由が分からない。
          # 2026-08-04 以降のデプロイが全部これで、サーバーに hobby-stock.jp の
          # ディレクトリが無いことに気づくまで1か月かかった。先に確かめる。
          if ! ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/deploy_key -p 10022                  "$SSH_USERNAME@$SSH_HOST" 'test -d ~/hobby-stock.jp/public_html'; then
            echo "::error::サーバーに hobby-stock.jp/public_html がありません。"
            echo "Xserver の管理画面でドメイン hobby-stock.jp を追加し、"
            echo "無料SSLを発行してください（いまHTTPSが応答しません）。"
            echo "リポジトリ側では直せません。"
            exit 1
          fi

          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -p 10022" ./dist/ "$SSH_USERNAME@$SSH_HOST:/home/xs501620/hobby-stock.jp/public_html/"
