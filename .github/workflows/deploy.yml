name: Deploy to Xserver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: 診断（dist の有無と接続確認）
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          echo "--- dist ---"; ls -la dist | head -10 || echo "dist が無い"
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 10022 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "--- 鍵の形 ---"; head -1 ~/.ssh/deploy_key | cut -c1-40; wc -l < ~/.ssh/deploy_key
          echo "--- 接続 ---"
          set +e
          out=$(ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/deploy_key -p 10022 "$SSH_USERNAME@$SSH_HOST" 'ls -d ~/hobby-stock.jp ~/hobby-stock.jp/public_html 2>&1; echo "---"; ls ~ | head -20' 2>&1)
          code=$?
          echo "$out" | sed -e "s/$SSH_HOST/HOST/g" -e "s/$SSH_USERNAME/USER/g"
          echo "ssh の終了コード: $code"

      - name: Deploy to Xserver via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 10022 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -p 10022" ./dist/ "$SSH_USERNAME@$SSH_HOST:/home/xs501620/hobby-stock.jp/public_html/"
